# This workflow does a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI main

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/setup@v2
      with:
        version: 11.22.0
        runtime: node@${{ matrix.node-version }}
        cache: true
    - run: pnpm lint
    - run: pnpm run --if-present build
    - run: pnpm test
